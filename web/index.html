<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LexPilot Enterprise</title>
  <style>
    body { margin:0; font-family:Arial; background:#f4f6f8; }
    header { background:#111827; color:white; padding:18px; font-size:24px; }
    .layout { display:flex; min-height:100vh; }
    nav { width:230px; background:#1f2937; color:white; padding:20px; }
    nav div { padding:12px; cursor:pointer; border-bottom:1px solid #374151; }
    main { flex:1; padding:25px; }
    .cards { display:flex; gap:20px; margin-bottom:25px; }
    .card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px #ccc; flex:1; }
    table { width:100%; border-collapse:collapse; background:white; }
    th,td { padding:12px; border-bottom:1px solid #ddd; text-align:left; }
    th { background:#e5e7eb; }
    button { padding:10px 14px; background:#2563eb; color:white; border:0; border-radius:6px; cursor:pointer; }
    input { padding:10px; margin:5px; }
  </style>
</head>
<body>
<header>⚖️ LexPilot Enterprise V1</header>

<div class="layout">
  <nav>
    <div onclick="showDashboard()">📊 Dashboard</div>
    <div onclick="loadClients()">👥 Clients</div>
    <div onclick="loadDossiers()">📁 Dossiers</div>
    <div onclick="loadDocuments()">📄 Documents</div>
    <div onclick="showMail()">📧 Mail</div>
    <div onclick="showOffice365()">📨 Office 365 / Outlook</div>
    <div onclick="showAgenda()">📅 Agenda</div>
    <div onclick="showTaches()">✅ Tâches</div>
    <div onclick="showScanner()">📠 Scanner / OCR</div>
    <div onclick="showVoice()">🎙️ Dictée vocale</div>
    <div onclick="showRpva()">⚖️ RPVA / e-Barreau</div>
    <div onclick="showVeille()">📚 Dernières lois</div>
    <div onclick="showStats()">📊 Statistiques Web / SEO</div>
    <div>🤖 IA</div>
    <div onclick="showUsers()">👤 Utilisateurs</div>
    <div>⚙️ Paramètres</div>
  </nav>

  <main id="app">
    Chargement...
  </main>
</div>

<script>
const API = "";

async function showDashboard() {
  const r = await fetch(API + "/api/dashboard");
  const d = await r.json();
  document.getElementById("app").innerHTML = `
    <h1>Dashboard</h1>
    <div class="cards">
      <div class="card"><h2>${d.clients}</h2><p>Clients</p></div>
      <div class="card"><h2>${d.dossiers}</h2><p>Dossiers</p></div>
      <div class="card"><h2>${d.documents}</h2><p>Documents</p></div>
    </div>
    <div class="card"><b>Statut :</b> ${d.message}</div>
  `;
}

async function loadClients() {
  const r = await fetch(API + "/api/clients");
  const data = await r.json();
  let rows = data.map(x => `<tr><td>${x.firstName}</td><td>${x.lastName}</td><td>${x.email ?? ""}</td><td>${x.city ?? ""}</td></tr>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>Clients</h1>
    <div class="card">
      <input id="fn" placeholder="Prénom">
      <input id="ln" placeholder="Nom">
      <input id="em" placeholder="Email">
      <button onclick="createClient()">Ajouter client</button>
    </div>
    <br>
    <table><tr><th>Prénom</th><th>Nom</th><th>Email</th><th>Ville</th></tr>${rows}</table>
  `;
}

async function createClient() {
  await fetch(API + "/api/clients", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      firstName: document.getElementById("fn").value,
      lastName: document.getElementById("ln").value,
      email: document.getElementById("em").value,
      city: "Lille"
    })
  });
  loadClients();
}

async function loadDossiers() {
  const r = await fetch(API + "/api/dossiers");
  const data = await r.json();
  let rows = data.map(x => `<tr><td>${x.numero}</td><td>${x.titre}</td><td>${x.typeAffaire}</td><td>${x.statut}</td></tr>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>Dossiers</h1>
    <table><tr><th>Numéro</th><th>Titre</th><th>Type</th><th>Statut</th></tr>${rows}</table>
  `;
}

async function loadDocuments() {
  const r = await fetch(API + "/api/documents");
  const data = await r.json();
  let rows = data.map(x => `<tr><td>${x.originalFileName}</td><td>${x.category ?? ""}</td><td>${x.sizeBytes}</td></tr>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>Documents</h1>
    <table><tr><th>Nom</th><th>Catégorie</th><th>Taille</th></tr>${rows}</table>
  `;
}


function showMail(){ document.getElementById("app").innerHTML = "<h1>📧 Mail</h1><div class='card'>Module messagerie : réception, classement par dossier, pièces jointes, suivi des échanges.</div>"; }

function showOffice365(){
  document.getElementById("app").innerHTML = `
    <h1>📨 Office 365 / Outlook</h1>
    <div class="cards">
      <div class="card"><h2>0</h2><p>Mails reçus</p></div>
      <div class="card"><h2>0</h2><p>Mails à classer</p></div>
      <div class="card"><h2>0</h2><p>Pièces jointes</p></div>
    </div>
    <div class="card">
      <h3>Connexion Microsoft 365</h3>
      <p>Prévu : connexion via Microsoft Graph avec OAuth sécurisé.</p>
      <button>Connecter Office 365</button>
    </div>
    <div class="card">
      <h3>Fonctions prévues</h3>
      <p>Lecture des emails, envoi, pièces jointes, classement automatique dans les dossiers, résumé IA des échanges.</p>
    </div>
    <div class="card">
      <h3>Classement intelligent</h3>
      <p>LexPilot pourra associer un email à un client ou à un dossier selon l'expéditeur, le sujet, les pièces jointes et le contenu.</p>
    </div>
  `;
}
function showAgenda(){ document.getElementById("app").innerHTML = "<h1>📅 Agenda</h1><div class='card'>Module agenda : audiences, rendez-vous, échéances, rappels, synchronisation future Outlook/Google.</div>"; }
function showScanner(){ document.getElementById("app").innerHTML = "<h1>📠 Scanner / OCR</h1><div class='card'>Module scanner : dépôt de PDF/scans, OCR, classement automatique dans les dossiers.</div>"; }
function showVoice(){ document.getElementById("app").innerHTML = "<h1>🎙️ Dictée vocale</h1><div class='card'>Module dictée : notes vocales, transcription, génération de brouillons de courriers.</div>"; }
function showRpva(){ document.getElementById("app").innerHTML = "<h1>⚖️ RPVA / e-Barreau</h1><div class='card'>Module RPVA : passerelle prévue avec e-Barreau/CNB après autorisation éditeur.</div>"; }
function showVeille(){ document.getElementById("app").innerHTML = "<h1>📚 Dernières lois</h1><div class='card'>Module veille juridique : connexion future à Légifrance/PISTE pour lois, décrets et jurisprudence.</div>"; }

function showStats(){
  document.getElementById("app").innerHTML = `
    <h1>📊 Statistiques Web / Référencement</h1>
    <div class="cards">
      <div class="card"><h2>0</h2><p>Visiteurs aujourd'hui</p></div>
      <div class="card"><h2>0</h2><p>Prospects entrants</p></div>
      <div class="card"><h2>0</h2><p>Conversions</p></div>
    </div>
    <div class="card">
      <h3>Sources de trafic</h3>
      <p>Google, réseaux sociaux, accès direct, campagnes publicitaires.</p>
    </div>
    <div class="card">
      <h3>SEO / Référencement</h3>
      <p>Suivi futur : Google Search Console, mots-clés, pages les plus visitées, positionnement.</p>
    </div>
    <div class="card">
      <h3>Objectif</h3>
      <p>Identifier les visiteurs, mesurer les demandes clients, suivre les prospects et améliorer le référencement du cabinet.</p>
    </div>
  `;
}


async function showTaches(){
  const r = await fetch("/api/taches");
  const data = await r.json();
  let rows = data.map(x => `<tr><td>${x.titre}</td><td>${x.priorite}</td><td>${x.statut}</td></tr>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>✅ Tâches</h1>
    <div class="card">
      <input id="taskTitle" placeholder="Nouvelle tâche">
      <button onclick="createTache()">Ajouter</button>
    </div>
    <br>
    <table><tr><th>Titre</th><th>Priorité</th><th>Statut</th></tr>${rows}</table>
  `;
}

async function createTache(){
  await fetch("/api/taches", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      titre: document.getElementById("taskTitle").value,
      priorite: "Normale",
      statut: "A faire"
    })
  });
  showTaches();
}


async function showUsers(){
  const r = await fetch("/api/utilisateurs");
  const data = await r.json();
  let rows = data.map(x => `<tr><td>${x.nom}</td><td>${x.email}</td><td>${x.role}</td><td>${x.actif}</td></tr>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>👤 Utilisateurs</h1>
    <div class="card">
      <input id="userNom" placeholder="Nom">
      <input id="userEmail" placeholder="Email">
      <input id="userRole" placeholder="Rôle" value="Avocat">
      <button onclick="createUser()">Ajouter</button>
    </div>
    <br>
    <table><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Actif</th></tr>${rows}</table>
  `;
}

async function createUser(){
  await fetch("/api/utilisateurs", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      nom: document.getElementById("userNom").value,
      email: document.getElementById("userEmail").value,
      role: document.getElementById("userRole").value,
      actif: true
    })
  });
  showUsers();
}

async function testLegifranceLive(){
  const r = await fetch("/api/legifrance/test");
  const d = await r.json();
  alert(d.service + "\n" + d.status + "\n" + d.message);
}

async function testOutlookLive(){
  const r = await fetch("/api/outlook/test");
  const d = await r.json();
  alert(d.service + "\n" + d.status + "\n" + d.message);
}

function showLegifrance(){
  document.getElementById("app").innerHTML = `
    <h1>📚 Légifrance</h1>
    <div class="card"><p>Recherche juridique via API officielle Légifrance / PISTE.</p><button onclick="testLegifranceLive()">Tester connexion Légifrance</button></div>
  `;
}

function showOffice365(){
  document.getElementById("app").innerHTML = `
    <h1>📨 Office 365 / Outlook</h1>
    <div class="card"><p>Connexion future Microsoft Graph pour lire et classer les emails.</p><button onclick="testOutlookLive()">Tester connexion Outlook</button></div>
  `;
}

showDashboard();
</script>
</body>
</html>
