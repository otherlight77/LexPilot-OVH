<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LexPilot Enterprise</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
header{background:#111827;color:white;padding:18px;font-size:24px}
.layout{display:flex;min-height:100vh}
nav{width:260px;background:#1f2937;color:white;padding:20px}
nav div{padding:11px;cursor:pointer;border-bottom:1px solid #374151}
main{flex:1;padding:25px}
.cards{display:flex;gap:20px;margin-bottom:25px;flex-wrap:wrap}
.card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 8px #ccc;min-width:220px;margin-bottom:15px}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#e5e7eb}
button{padding:10px 14px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}
input{padding:10px;margin:5px}
</style>
</head>
<body>
<header>⚖️ LexPilot Enterprise V1</header>
<div class="layout">
<nav>
<div onclick="showDashboard()">📊 Dashboard</div>
<div onclick="loadClients()">👥 Clients</div>
<div onclick="loadDossiers()">📁 Dossiers</div>
<div onclick="loadDocuments()">📄 Documents</div>
<div onclick="showMail()">📧 Mail</div>
<div onclick="showOffice365()">📨 Office 365</div>
<div onclick="showAgenda()">📅 Agenda</div>
<div onclick="showTasks()">✅ Tâches</div>
<div onclick="showLegifrance()">📚 Légifrance</div>
<div onclick="showVoice()">🎙️ Dictée</div>
<div onclick="showStats()">📊 Stats Web / SEO</div>
<div onclick="showBilling()">💰 Facturation</div>
<div onclick="showPortal()">👤 Portail client</div>
<div onclick="showAi()">🤖 IA</div>
<div onclick="showAdmin()">⚙️ Administration</div>
</nav>
<main id="app">Chargement...</main>
</div>

<script>
async function api(url){ const r=await fetch(url); if(!r.ok) throw new Error(url); return await r.json(); }

async function showDashboard(){
 try{
  const d=await api("/api/dashboard");
  app.innerHTML=`<h1>Dashboard</h1><div class="cards">
  <div class="card"><h2>${d.clients}</h2><p>Clients</p></div>
  <div class="card"><h2>${d.dossiers}</h2><p>Dossiers</p></div>
  <div class="card"><h2>${d.documents}</h2><p>Documents</p></div>
  </div><div class="card">${d.message}</div>`;
 }catch(e){ app.innerHTML="<h1>Erreur API</h1><div class='card'>"+e+"</div>"; }
}

async function loadClients(){
 const data=await api("/api/clients");
 let rows=data.map(x=>`<tr><td>${x.firstName}</td><td>${x.lastName}</td><td>${x.email||""}</td><td>${x.city||""}</td></tr>`).join("");
 app.innerHTML=`<h1>Clients</h1><table><tr><th>Prénom</th><th>Nom</th><th>Email</th><th>Ville</th></tr>${rows}</table>`;
}

async function loadDossiers(){
 const data=await api("/api/dossiers");
 let rows=data.map(x=>`<tr><td>${x.numero}</td><td>${x.titre}</td><td>${x.typeAffaire}</td><td>${x.statut}</td></tr>`).join("");
 app.innerHTML=`<h1>Dossiers</h1><table><tr><th>Numéro</th><th>Titre</th><th>Type</th><th>Statut</th></tr>${rows}</table>`;
}

async function loadDocuments(){
 const data=await api("/api/documents");
 let rows=data.map(x=>`<tr><td>${x.originalFileName}</td><td>${x.category||""}</td><td>${x.sizeBytes}</td></tr>`).join("");
 app.innerHTML=`<h1>Documents</h1><table><tr><th>Nom</th><th>Catégorie</th><th>Taille</th></tr>${rows}</table>`;
}

function showMail(){app.innerHTML="<h1>Mail</h1><div class='card'>Messagerie, classement automatique, pièces jointes.</div>";}
function showOffice365(){app.innerHTML="<h1>Office 365</h1><div class='card'>Connexion Microsoft Graph prévue.</div>";}
function showAgenda(){app.innerHTML="<h1>Agenda</h1><div class='card'>Audiences, RDV, rappels.</div>";}
function showTasks(){app.innerHTML="<h1>Tâches</h1><div class='card'>Tâches cabinet et rappels.</div>";}
function showLegifrance(){app.innerHTML="<h1>Légifrance</h1><div class='card'>API PISTE à connecter.</div>";}
function showVoice(){app.innerHTML="<h1>Dictée</h1><div class='card'>Micro PC, Bluetooth ou smartphone.</div>";}
function showStats(){app.innerHTML="<h1>Stats Web / SEO</h1><div class='card'>Google, SEO, prospects, conversions.</div>";}
function showBilling(){app.innerHTML="<h1>Facturation</h1><div class='card'>Honoraires, temps passé, factures.</div>";}
function showPortal(){app.innerHTML="<h1>Portail client</h1><div class='card'>Documents, messages, signatures.</div>";}
function showAi(){app.innerHTML="<h1>IA</h1><div class='card'>Résumés, chronologie, recherche documentaire.</div>";}
function showAdmin(){app.innerHTML="<h1>Administration</h1><div class='card'>Utilisateurs, rôles, sauvegardes, import/export.</div>";}

showDashboard();
</script>
</body>
</html>
